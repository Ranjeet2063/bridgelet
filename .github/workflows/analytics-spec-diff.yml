name: Analytics spec-vs-code drift check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  event-name-drift:
    name: Compare analytics event names in spec vs code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract event names from spec and code
        run: |
          # Events in the spec are `#### \`Event Name\`` headings (#677: Sections 4-6).
          grep -E '^#### `[^`]+`' docs/analytics-spec.md \
            | sed -E 's/^#### `([^`]+)`.*/\1/' \
            > /tmp/spec_events.txt

          # Frontend event names are the single source-of-truth in the generated file (#677).
          # Extract only from the ANALYTICS_EVENTS array to avoid false positives like 'string'.
          if [ -f frontend/lib/analytics-events.ts ]; then
            awk '/export const ANALYTICS_EVENTS = \[/{flag=1} flag{print} flag && /\] as const;/{exit}' frontend/lib/analytics-events.ts \
              | grep -oE "'[A-Za-z0-9 ]+'" \
              | tr -d "'" \
              >> /tmp/code_events.txt
          else
            awk '/type ClaimEvent =/{flag=1} flag{print} flag && /;$/{exit}' frontend/lib/analytics.ts \
              | grep -oE "'[A-Za-z0-9 ]+'" \
              | tr -d "'" \
              >> /tmp/code_events.txt
          fi

          # Mobile event names are the `name:` discriminator values.
          awk '/export type AnalyticsEvent =/{flag=1} flag{print} flag && /^};/{exit}' mobile/app/src/analytics/analytics.ts \
            | grep -oE 'name: *"[A-Za-z0-9 ]+"' \
            | sed -E 's/name: *"([A-Za-z0-9 ]+)"/\1/' \
            >> /tmp/code_events.txt

          sort -u /tmp/spec_events.txt > /tmp/spec.txt
          sort -u /tmp/code_events.txt > /tmp/code.txt

      - name: Verify generated event list is fresh (#677)
        run: |
          cp frontend/lib/analytics-events.ts /tmp/analytics-events.committed.ts
          node frontend/scripts/generate-analytics-events.mjs
          if ! diff -u /tmp/analytics-events.committed.ts frontend/lib/analytics-events.ts; then
            echo "::error::frontend/lib/analytics-events.ts is stale. Run 'npm run generate:analytics-events' in frontend/ and commit the result."
            exit 1
          fi

      - name: Compare and fail on drift
        run: |
          echo "## Analytics event-name drift (spec vs code)" >> "$GITHUB_STEP_SUMMARY"
          echo "### In spec but not in code" >> "$GITHUB_STEP_SUMMARY"
          comm -23 /tmp/spec.txt /tmp/code.txt >> "$GITHUB_STEP_SUMMARY"
          echo "### In code but not in spec" >> "$GITHUB_STEP_SUMMARY"
          comm -13 /tmp/spec.txt /tmp/code.txt >> "$GITHUB_STEP_SUMMARY"

          SPEC_ONLY=$(comm -23 /tmp/spec.txt /tmp/code.txt | wc -l | tr -d ' ')
          CODE_ONLY=$(comm -13 /tmp/spec.txt /tmp/code.txt | wc -l | tr -d ' ')
          if [ "$((SPEC_ONLY + CODE_ONLY))" -gt 0 ]; then
            echo "::error::Analytics event names in docs/analytics-spec.md and frontend/mobile source have drifted apart (spec-only: ${SPEC_ONLY}, code-only: ${CODE_ONLY})."
            exit 1
          fi